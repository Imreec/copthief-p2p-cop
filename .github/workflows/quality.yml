name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Fast fail-first lane (~3-4 min): every gate EXCEPT the test suite. A lint slip,
  # type error, size overrun, or mirror drift reports here long before the suite
  # lane finishes — the suite lane no longer queues behind the cheap checks.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      # Keyless CI: dev tooling only. Live deps (LLM/Gmail/tunnel) are never installed here.
      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict, src)
        run: uv run mypy src/

      - name: File-size check (150 source lines)
        run: uv run python scripts/check_file_sizes.py

      - name: Anti-pattern check
        run: uv run python scripts/check_anti_patterns.py

      - name: No-hardcoded check
        run: uv run python scripts/check_no_hardcoded.py

      - name: Core-mirror manifest check
        run: uv run python scripts/sync_core.py --verify

      # Kit CORE conformance — byte-level interop, CI-blocking (CLAUDE.md §1 #13).
      - name: Kit CORE vectors
        run: |
          if [ -d tests/conformance ]; then
            uv run pytest tests/conformance -v
          else
            echo "tests/conformance not yet populated (M1) — skipped"
          fi

      - name: Self-grade config validation
        run: uv run python scripts/self_grade.py --validate

      - name: Submission checklist (non-blocking report until M8)
        run: uv run python scripts/check_submission.py

  # The suite lane keeps the historical job id `quality` so anything keyed to that
  # check name still points at a blocking gate. Runs in PARALLEL with `gates`.
  quality:
    runs-on: ubuntu-latest
    # M9: the forcing solver fires inside the arena integration games; the suite went
    # ~68s -> ~334s locally and ~23-28m on this runner. Node-capped, so the bound is
    # firm - 30 keeps margin. Deliberately NOT trimmed via arena seeds or the solver
    # node cap: those are the measurement, not speed knobs. pytest-xdist considered
    # and deferred - it needs a flakiness trial we will not run the weekend before
    # the deadline (threads + shared tmp paths in the peer tests).
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Tests with coverage
        run: uv run pytest --cov=src --cov-report=xml --cov-fail-under=85
