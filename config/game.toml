# Private per-peer config (book App B s4): never crosses the wire, never negotiated.
# game.json overlays this file on shared keys - the private file can never weaken a signed term.
# M1 carries only the sections the walking skeleton reads; [strategy]/[trash_talk]/[llm]/[email]
# arrive with their milestones (M5/M6).

version = "1.03"

[game]
group_name = "ImreEyal-Police"
group_id = "imreeyal"
sub_game_number = 1
# Group identity (F8b): exchanged in the handshake so the opponent can build the
# whole-match declaration; the reference's writer requires every key.
members = ["Imree Cohen", "Eyal Shtinmetz"]
llm_model = "none"
# M7-41 league ledger (book §9.2.1; rules 37-38). Declared mutually at every game start
# and read by the diversity weighting. UPDATE AFTER EVERY COUNTED SERIES, never after a
# warm-up: a stale count makes the NEXT counted game declare "first meeting" falsely,
# which is a project-level disqualification (rule 38). First counted series played
# 2026-08-04 vs anrbj666 (30-90; artifacts in reports/counted-series/).
counted_games_played = 1
counted_opponents = ["anrbj666"]

[game.repos]
cop = "https://github.com/Imreec/copthief-p2p-cop"
thief = "https://github.com/Imreec/copthief-p2p-thief"

[game.mcp_servers]
cop = "https://cop.imreeyal.com/mcp"
thief = "https://thief.imreeyal.com/mcp"

[strategy]
# Private brain selection (PLAN s7): which BrainBase class each role runs (book s6.2
# package.module:Class notation for role brains). The sparring host stays on the
# generic brain - tuned weights never deploy there (CLAUDE.md s9).
police_class = "copthief_police.brain:PoliceBrain"
thief_class = "random"

[strategy.police]
# PoliceBrain knobs: the canonical defaults live in copthief_police/features.py
# (DEFAULT_OPTIONS data table, AppFTable pattern); keys here override them.
# The M5-4 GA writes tuned values into this table - code never changes.
barrier_gain_threshold = 4.7893
p_commit = 0.2
w_budget = 1.7277
w_distance = 3.8875
w_mobility = 3.6061
w_region = 0.1143

[strategy.police.multiplicative_book_v1]
# M7-15 per-model overlay: applies ONLY when [scent] model selects this name
# (tuned vectors are physics-specific - the M7-14/15 gate comparisons). This is
# the mixed-pool book-v1 vector (config/ga_weights_bookv1.json): beats the old
# champion in BOTH physics tables, balanced across all five thief arms.
barrier_gain_threshold = 4.692992169904358
p_commit = 0.5526774858901863
w_budget = 1.829321347518278
w_distance = 6.0
w_mobility = 3.707966311991116
w_region = 0.03057885641327504
# M7-19 quiet-cop policy: declare a capture only when the belief gives at least this
# probability to the cell we just landed on. Book-v1 only, because that is the only
# physics the sweep measured (docs/evidence/m7-19-quiet-cop.md): 0.1 is best-or-tied
# against EVERY opponent arm - +24% cop points against a claim-reading thief and zero
# cost against one that ignores claims - so it needs no intel about who we are playing.
# It is safe HERE and nowhere else by default: this vector wins by walling, and only
# the LANDING capture is claim-gated. A chasing vector silenced the same way loses
# everything (32/32 -> 0/32 captures), which is why the base table below is untouched.
claim_threshold = 0.1

[scent]
# Which NAMED scent model we play (M3-8, ADR-0004 v2; registrations in
# config/locked_models.json, kit SPEC s7). Private until the handshake, which declares
# only the model's HASH - the doc itself never crosses the wire.
#   subtractive_chebyshev_v1 = the reference form, our default. Byte-identical to what
#                              M3-2 shipped; this is what plays against the reference peer.
#   multiplicative_book_v1   = the book ch.4 model. Set this ONLY for a pair that has
#                              agreed to lock it - a peer that declares a different model
#                              refuses the game (both-declare-and-differ, rule s7).
model = "subtractive_chebyshev_v1"
# M6-7 audit sensitivity: how far a re-derived cell may sit from the transmitted one
# before the scent-physics check calls it a mismatch. IGNORED for a model that rounds
# (the reference form is round-3 exact, so any difference is a difference). It binds
# only for a no-rounding model like multiplicative_book_v1, where two HONEST peers
# differ in the last IEEE-754 bit because each side recomputes rather than receives.
# Private, evidence-grade only (SQ3) - never negotiated, never flips a result.
physics_tolerance = 1e-9

[belief]
# Private evidence-trust tuning (PRD_belief s5): how sharply the scent/hint likelihoods
# multiply into the Bayes filter. Never signed, never crosses the wire (SQ3 stance:
# the transmitted grid is unauthenticated - trust is a tunable, never an axiom).
smell_trust_weight = 4.0
hint_trust_default = 1.0
# M5-5 profiling: the post-audit lie-rate scales the NEXT mini-game's hint trust
# down toward (never past) this floor - distrust-but-never-eliminate.
profile_hint_floor = 0.2

[gui]
# Live-view render knobs (PRD_gui_replay s7): display-only, never negotiated. The
# heatmap anchors are the p=0 / p=1 colors of the belief shading (book fig. 9);
# the theme block is the dark-slate window chrome.
refresh_ms = 200
cell_px = 64
heat_low = "#1e293b"
heat_high = "#dc2626"
png_dpi = 150
font_family = "Segoe UI"
font_size = 11
theme_bg = "#0f172a"
theme_panel = "#1e293b"
theme_fg = "#e2e8f0"
accent = "#38bdf8"

[network]
my_port = 8802
opponent_url = ""
# Private timing budget (M2 F1 symmetric loop): opponent silent past turn_timeout ->
# technical loss; poll paces inbox drains; connect bounds handshake/audit waits.
turn_timeout_seconds = 180
poll_interval_seconds = 0.5
connect_timeout_seconds = 60
# M7-8 at-least-once tolerance: how many steps AHEAD of the awaited one we hold before
# calling it a flood. A lost HTTP ack makes the sender retry, so two of the opponent's
# pushes can be in flight at once and land out of order; anything past this window is
# a protocol violation, not a tunnel artifact. 1 covers the realistic race (one step
# ahead) - raise it only with a drill that shows a deeper reorder actually happening.
inbound_buffer_limit = 1

[email]
# M7-6 automatic report rail (ADR-0008; PRD_reporting s5a). App E rule 32 requires
# automatic reporting and rule 35 zeroes BOTH teams when one side fails to report, so
# there is no post-game human step. THE AUTHORIZATION IS THE RECIPIENT: with none
# configured nothing can leave, whatever else is set. Resting state = disabled, no
# recipient. Per run: the lecturer alone for a counted series
# (rmisegal+uoh26finalgame@gmail.com - the book's sole binding address), or us + the
# opponent team for a friendly report exchange. sender = the dedicated team Gmail
# account (OI-5). Runaway protection is the gatekeeper (rule 28, rate_limits.json).
# KEEP THIS SECTION LAST: the settings tests derive the "absent section" case by
# cutting the file at the [email] header.
enabled = false
mode = "send"
recipient = []
sender = ""
token_path = "token.json"
# The book's sole binding reporting address (s9.3). Naming it here is what lets the
# interlock REFUSE it outside a counted series: `counted` arms the App F counted rows,
# so a counted constitution will not even load unless it is a genuine six-mini-game
# match - the flag cannot be set by accident, which makes it the honest gate for
# "no email to the lecturer without Imree's explicit word". Friendlies are unaffected.
lecturer = "rmisegal+uoh26finalgame@gmail.com"
