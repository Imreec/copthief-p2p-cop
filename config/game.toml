# Private per-peer config (book App B s4): never crosses the wire, never negotiated.
# game.json overlays this file on shared keys - the private file can never weaken a signed term.
# M1 carries only the sections the walking skeleton reads; [strategy]/[trash_talk]/[llm]/[email]
# arrive with their milestones (M5/M6).

version = "1.00"

[game]
group_name = "ImreEyal-Police"
group_id = "imreeyal"
sub_game_number = 1
# Group identity (F8b): exchanged in the handshake so the opponent can build the
# whole-match declaration; the reference's writer requires every key.
members = ["Imree Cohen", "Eyal Shtinmetz"]
llm_model = "none"

[game.repos]
cop = "https://github.com/Imreec/copthief-p2p-cop"
thief = "https://github.com/Imreec/copthief-p2p-thief"

[game.mcp_servers]
cop = "https://cop.imreeyal.com/mcp"
thief = "https://thief.imreeyal.com/mcp"

[strategy]
# Private brain selection (PLAN s7): which BrainBase class each role runs (book s6.2
# package.module:Class notation for role brains). The sparring host stays on the
# generic brain - tuned weights never deploy there (CLAUDE.md s9).
police_class = "copthief_police.brain:PoliceBrain"
thief_class = "random"

[strategy.police]
# PoliceBrain knobs: the canonical defaults live in copthief_police/features.py
# (DEFAULT_OPTIONS data table, AppFTable pattern); keys here override them.
# The M5-4 GA writes tuned values into this table - code never changes.
barrier_gain_threshold = 4.7893
p_commit = 0.2
w_budget = 1.7277
w_distance = 3.8875
w_mobility = 3.6061
w_region = 0.1143

[belief]
# Private evidence-trust tuning (PRD_belief s5): how sharply the scent/hint likelihoods
# multiply into the Bayes filter. Never signed, never crosses the wire (SQ3 stance:
# the transmitted grid is unauthenticated - trust is a tunable, never an axiom).
smell_trust_weight = 4.0
hint_trust_default = 1.0
# M5-5 profiling: the post-audit lie-rate scales the NEXT mini-game's hint trust
# down toward (never past) this floor - distrust-but-never-eliminate.
profile_hint_floor = 0.2

[gui]
# Live-view render knobs (PRD_gui_replay s7): display-only, never negotiated. The
# heatmap anchors are the p=0 / p=1 colors of the belief shading (book fig. 9);
# the theme block is the dark-slate window chrome.
refresh_ms = 200
cell_px = 64
heat_low = "#1e293b"
heat_high = "#dc2626"
png_dpi = 150
font_family = "Segoe UI"
font_size = 11
theme_bg = "#0f172a"
theme_panel = "#1e293b"
theme_fg = "#e2e8f0"
accent = "#38bdf8"

[network]
my_port = 8802
opponent_url = ""
# Private timing budget (M2 F1 symmetric loop): opponent silent past turn_timeout ->
# technical loss; poll paces inbox drains; connect bounds handshake/audit waits.
turn_timeout_seconds = 180
poll_interval_seconds = 0.5
connect_timeout_seconds = 60

[email]
# M7-6 automatic report rail (ADR-0008; PRD_reporting s5a). App E rule 32 requires
# automatic reporting and rule 35 zeroes BOTH teams when one side fails to report, so
# there is no post-game human step. THE AUTHORIZATION IS THE RECIPIENT: with none
# configured nothing can leave, whatever else is set. Resting state = disabled, no
# recipient. Per run: the lecturer alone for a counted series
# (rmisegal+uoh26finalgame@gmail.com - the book's sole binding address), or us + the
# opponent team for a friendly report exchange. sender = the dedicated team Gmail
# account (OI-5). Runaway protection is the gatekeeper (rule 28, rate_limits.json).
# KEEP THIS SECTION LAST: the settings tests derive the "absent section" case by
# cutting the file at the [email] header.
enabled = false
mode = "send"
recipient = []
sender = ""
token_path = "token.json"
# The book's sole binding reporting address (s9.3). Naming it here is what lets the
# interlock REFUSE it outside a counted series: `counted` arms the App F counted rows,
# so a counted constitution will not even load unless it is a genuine six-mini-game
# match - the flag cannot be set by accident, which makes it the honest gate for
# "no email to the lecturer without Imree's explicit word". Friendlies are unaffected.
lecturer = "rmisegal+uoh26finalgame@gmail.com"
